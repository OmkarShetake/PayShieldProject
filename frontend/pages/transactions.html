<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PayShield — Transactions</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    .filters { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
    .filters .fg { margin:0; }
    .filters input, .filters select { width:auto; min-width:130px; padding:7px 10px; font-size:12px; }
    .mini-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px; }
    .mini { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; text-align:center; transition:border-color .15s; }
    .mini:hover { border-color:var(--border2); }
    .mini-val { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
    .mini-lbl { font-size:10px; color:var(--text3); font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }
    .pag { display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--border); margin-top:4px; }
    .pag-info { font-size:11px; color:var(--text3); font-family:var(--mono); }
    .row-new { animation: rowFlash .6s ease; }
    @keyframes rowFlash { from { background:rgba(59,111,240,.12); } to { background:transparent; } }
    .amount-cell { font-weight:700; }
    .copy-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:11px; padding:2px 4px; border-radius:3px; transition:color .1s; }
    .copy-btn:hover { color:var(--accent); }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><div class="topbar-title">Transactions</div><div class="topbar-sub">PayShield / Payments</div></div>
      <div class="topbar-right">
        <span class="last-updated" id="upd-time"></span>
        <div class="live-badge"><div class="live-dot"></div>Live</div>
        <button class="btn ghost sm" onclick="openModal()">+ Initiate</button>
        <div id="ring-wrap"></div>
      </div>
    </div>

    <div class="content" id="content-wrap">
      <div class="mini-stats">
        <div class="mini"><div class="mini-val" id="s-all">—</div><div class="mini-lbl">Total</div></div>
        <div class="mini"><div class="mini-val" style="color:var(--green)" id="s-ok">—</div><div class="mini-lbl">Completed</div></div>
        <div class="mini"><div class="mini-val" style="color:var(--red)" id="s-fail">—</div><div class="mini-lbl">Failed</div></div>
        <div class="mini"><div class="mini-val" style="color:var(--amber)" id="s-pend">—</div><div class="mini-lbl">Pending</div></div>
        <div class="mini"><div class="mini-val" style="color:var(--red)" id="s-flag">—</div><div class="mini-lbl">Flagged</div></div>
      </div>

      <div class="filters">
        <div class="fg"><label>Search</label><input type="text" id="f-q" placeholder="ID or email…" oninput="filter()"/></div>
        <div class="fg"><label>Status</label>
          <select id="f-s" onchange="filter()">
            <option value="">All Status</option>
            <option>COMPLETED</option><option>FAILED</option>
            <option>PENDING</option><option>FRAUD_CHECK</option>
          </select>
        </div>
        <div class="fg"><label>Method</label>
          <select id="f-m" onchange="filter()">
            <option value="">All Methods</option>
            <option>CARD</option><option>UPI</option>
            <option>NET_BANKING</option><option>WALLET</option><option>BANK_TRANSFER</option>
          </select>
        </div>
        <div class="fg"><label>Fraud</label>
          <select id="f-f" onchange="filter()">
            <option value="">All</option>
            <option value="yes">Flagged Only</option>
          </select>
        </div>
        <button class="btn ghost sm" style="margin-bottom:0" onclick="load()">↻ Refresh</button>
      </div>

      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>ID</th><th>Amount</th><th>Method</th>
              <th>Customer</th><th>Score</th><th>Status</th><th>Date</th>
            </tr></thead>
            <tbody id="tbody"><tr><td colspan="7"><div class="empty"><div class="empty-icon">⏳</div>Loading…</div></td></tr></tbody>
          </table>
        </div>
        <div class="pag">
          <span class="pag-info" id="pag-info">—</span>
          <div style="display:flex;gap:8px">
            <button class="btn ghost sm" onclick="pg(-1)">← Prev</button>
            <button class="btn ghost sm" onclick="pg(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Initiate Payment Modal -->
<div class="modal-overlay hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Initiate Payment</div>
    <div class="modal-sub">Create a new transaction for testing</div>
    <div class="g2">
      <div class="fg"><label>Amount (INR)</label><input type="number" id="m-amount" placeholder="5000" min="1"/></div>
      <div class="fg"><label>Method</label>
        <select id="m-method">
          <option>CARD</option><option>UPI</option>
          <option>NET_BANKING</option><option>WALLET</option><option>BANK_TRANSFER</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Customer Email</label><input type="email" id="m-email" placeholder="customer@example.com"/></div>
    <div class="fg"><label>Description</label><input type="text" id="m-desc" placeholder="Test payment"/></div>
    <div class="modal-footer">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="m-btn" onclick="initiatePayment()">Initiate →</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script>
initPage('transactions');
let all = [], filtered = [], page = 0, ps = 12, ringTimer;

async function load() {
  const mid = getMerchantId();
  const d = await apiFetch(mid ? `/api/payments?size=100` : '/api/payments?size=100');
  const isMock = !d;
  const fresh = (d?.content || d) || mockTransactions(40);
  if (isMock) showMockBanner('content-wrap'); else hideMockBanner('content-wrap');

  // Flash new rows
  const oldIds = new Set(all.map(t => t.id));
  all = fresh;
  all._newIds = new Set(fresh.filter(t => !oldIds.has(t.id)).map(t => t.id));

  document.getElementById('s-all').textContent  = all.length;
  document.getElementById('s-ok').textContent   = all.filter(t => t.status === 'COMPLETED').length;
  document.getElementById('s-fail').textContent = all.filter(t => t.status === 'FAILED').length;
  document.getElementById('s-pend').textContent = all.filter(t => t.status === 'PENDING' || t.status === 'FRAUD_CHECK').length;
  document.getElementById('s-flag').textContent = all.filter(t => t.fraudFlagged).length;

  setLastUpdated('upd-time');
  filter();
}

function filter() {
  const q = document.getElementById('f-q').value.toLowerCase();
  const s = document.getElementById('f-s').value;
  const m = document.getElementById('f-m').value;
  const f = document.getElementById('f-f').value;
  filtered = all.filter(t =>
    (!q || t.id?.toLowerCase().includes(q) || t.customerEmail?.toLowerCase().includes(q)) &&
    (!s || t.status === s) && (!m || t.paymentMethod === m) && (!f || t.fraudFlagged)
  );
  page = 0; render();
}

function render() {
  const start = page * ps, rows = filtered.slice(start, start + ps);
  document.getElementById('pag-info').textContent = filtered.length
    ? `${start + 1}–${Math.min(start + ps, filtered.length)} of ${filtered.length}`
    : '0 results';
  if (!rows.length) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7"><div class="empty"><div class="empty-icon">🔍</div>No results</div></td></tr>`;
    return;
  }
  document.getElementById('tbody').innerHTML = rows.map(t => `
    <tr class="${all._newIds?.has(t.id) ? 'row-new' : ''}">
      <td>
        <span class="mono" style="font-size:11px;color:var(--text2)">${(t.id||'—').slice(0,8)}…</span>
        <button class="copy-btn" onclick="copyId('${t.id}')" title="Copy ID">⎘</button>
      </td>
      <td class="amount-cell">${fmt(t.amount)}</td>
      <td><span class="pill info" style="font-size:10px">${t.paymentMethod}</span></td>
      <td style="color:var(--text2);font-size:12px">${t.customerEmail || '—'}</td>
      <td>
        <div class="gauge-wrap">
          <div class="gauge-bar"><div class="gauge-fill" style="width:${t.fraudScore||0}%;background:${parseFloat(t.fraudScore)>=75?'var(--red)':parseFloat(t.fraudScore)>=50?'var(--amber)':'var(--green)'}"></div></div>
          <span class="score ${scoreClass(t.fraudScore)}" style="font-size:11px;width:32px;text-align:right">${parseFloat(t.fraudScore||0).toFixed(1)}</span>
        </div>
      </td>
      <td>${statusPill(t.status, t.fraudFlagged)}</td>
      <td style="color:var(--text3);font-size:11px">${fmtDate(t.initiatedAt)}</td>
    </tr>`).join('');
}

function copyId(id) {
  navigator.clipboard?.writeText(id).then(() => toast('Transaction ID copied', 'success', 2000));
}

function pg(d) { const mp = Math.ceil(filtered.length / ps) - 1; page = Math.max(0, Math.min(page + d, mp)); render(); }

function openModal() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('m-amount').focus();
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

async function initiatePayment() {
  const amount = parseFloat(document.getElementById('m-amount').value);
  const method = document.getElementById('m-method').value;
  const email  = document.getElementById('m-email').value;
  const desc   = document.getElementById('m-desc').value;

  if (!amount || amount < 1) { toast('Enter a valid amount', 'error'); return; }
  if (!email) { toast('Enter customer email', 'error'); return; }

  const btn = document.getElementById('m-btn');
  btn.disabled = true; btn.textContent = 'Processing…';

  const res = await apiFetch('/api/payments/initiate', {
    method: 'POST',
    body: JSON.stringify({ amount, currency: 'INR', paymentMethod: method, customerEmail: email, description: desc })
  });

  btn.disabled = false; btn.textContent = 'Initiate →';

  if (res) {
    toast(`Payment initiated — ${fmt(amount)} via ${method}`, 'success');
    closeModal();
    setTimeout(load, 1000);
  } else {
    toast('Failed to initiate payment', 'error');
  }
}

load();
ringTimer = createRefreshRing('ring-wrap', 20, load);
</script>
</body>
</html>
