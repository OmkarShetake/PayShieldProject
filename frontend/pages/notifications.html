<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PayShield — Notifications</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    .tabs { display:flex; gap:2px; background:var(--surface2); border-radius:7px; padding:3px; margin-bottom:16px; border:1px solid var(--border); width:fit-content; }
    .tab  { padding:6px 16px; border-radius:5px; font-size:12px; font-weight:500; cursor:pointer; color:var(--text3); transition:all .12s; position:relative; }
    .tab.active { background:var(--surface); color:var(--text); }
    .tab-badge { position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:9px; font-weight:700; font-family:var(--mono); padding:1px 4px; border-radius:8px; min-width:14px; text-align:center; }
    .notif-item { display:flex; align-items:flex-start; gap:12px; padding:14px 12px; border-bottom:1px solid rgba(35,38,58,.5); cursor:pointer; border-radius:6px; transition:background .1s; }
    .notif-item:last-child { border-bottom:none; }
    .notif-item:hover { background:rgba(255,255,255,.02); }
    .notif-item.unread { background:rgba(59,111,240,.04); }
    .n-icon { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
    .n-icon.ok   { background:rgba(34,197,94,.1); }
    .n-icon.err  { background:rgba(239,68,68,.1); }
    .n-icon.warn { background:rgba(245,158,11,.1); }
    .n-icon.info { background:rgba(59,111,240,.1); }
    .n-title { font-size:13px; font-weight:500; margin-bottom:3px; }
    .n-msg   { font-size:12px; color:var(--text2); line-height:1.5; }
    .n-time  { font-size:11px; color:var(--text3); font-family:var(--mono); margin-top:4px; }
    .n-dot   { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:5px; }
    .n-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><div class="topbar-title">Notifications</div><div class="topbar-sub">PayShield / Alerts & Events</div></div>
      <div class="topbar-right">
        <span class="last-updated" id="upd-time"></span>
        <button class="btn ghost sm" onclick="markAll()">✓ Mark all read</button>
        <div id="ring-wrap"></div>
      </div>
    </div>

    <div class="content">
      <div class="kpi-grid-3 mb2">
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-label">Total Today</div><div class="kpi-icon blue">🔔</div></div>
          <div class="kpi-val blue" id="n-tot">—</div>
          <div class="kpi-sub">All notifications</div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-label">Unread</div><div class="kpi-icon red">📬</div></div>
          <div class="kpi-val red" id="n-unread">—</div>
          <div class="kpi-sub">Pending review</div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-label">Fraud Alerts</div><div class="kpi-icon amber">⚠</div></div>
          <div class="kpi-val amber" id="n-fraud">—</div>
          <div class="kpi-sub">High priority</div>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <div class="tab active" onclick="setTab('all',this)">All<span class="tab-badge hidden" id="badge-all"></span></div>
        <div class="tab" onclick="setTab('fraud',this)">Fraud<span class="tab-badge hidden" id="badge-fraud"></span></div>
        <div class="tab" onclick="setTab('payment',this)">Payments</div>
        <div class="tab" onclick="setTab('system',this)">System</div>
      </div>

      <div class="card">
        <div id="notif-list"><div class="empty"><div class="empty-icon">🔔</div>Loading…</div></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script>
initPage('notifications');
let all = [], tab = 'all', ringTimer;

async function load() {
  const raw = await apiFetch('/api/notifications');
  if (raw && (raw.content || Array.isArray(raw))) {
    const apiData = raw.content || raw;
    all = apiData.map((n, i) => ({
      id: n.id || i,
      icon: n.type === 'FRAUD_ALERT' ? '🚨' : n.type === 'EMAIL' ? '📧' : '🔔',
      type: n.type === 'FRAUD_ALERT' ? 'fraud' : n.type === 'EMAIL' ? 'payment' : 'system',
      cls:  n.status === 'SENT' ? 'ok' : n.status === 'FAILED' ? 'err' : 'info',
      title: n.subject || 'Notification',
      msg:   n.body ? n.body.replace(/<[^>]*>/g, '').slice(0, 140) : '',
      read:  n.status === 'SENT',
      createdAt: n.sentAt || n.createdAt || new Date().toISOString()
    }));
  } else {
    all = mockNotifs();
  }

  updateCounts();
  setLastUpdated('upd-time');
  render();
}

function updateCounts() {
  const unread = all.filter(n => !n.read).length;
  const fraudUnread = all.filter(n => n.type === 'fraud' && !n.read).length;

  document.getElementById('n-tot').textContent    = all.length;
  document.getElementById('n-unread').textContent = unread;
  document.getElementById('n-fraud').textContent  = all.filter(n => n.type === 'fraud').length;

  // Tab badges
  const ba = document.getElementById('badge-all');
  const bf = document.getElementById('badge-fraud');
  if (unread > 0) { ba.textContent = unread; ba.classList.remove('hidden'); } else ba.classList.add('hidden');
  if (fraudUnread > 0) { bf.textContent = fraudUnread; bf.classList.remove('hidden'); } else bf.classList.add('hidden');

  // Page title
  document.title = unread > 0 ? `(${unread}) PayShield — Notifications` : 'PayShield — Notifications';
}

function setTab(t, el) {
  tab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function markAll() {
  all.forEach(n => n.read = true);
  updateCounts();
  render();
  toast('All notifications marked as read', 'success', 2000);
}

function render() {
  const data = tab === 'all' ? all : all.filter(n => n.type === tab);
  if (!data.length) {
    document.getElementById('notif-list').innerHTML = `<div class="empty"><div class="empty-icon">🔔</div>No notifications here</div>`;
    return;
  }
  document.getElementById('notif-list').innerHTML = data.map(n => `
    <div class="notif-item ${!n.read ? 'unread' : ''}" onclick="readNotif('${n.id}')">
      <div class="n-icon ${n.cls}">${n.icon}</div>
      <div style="flex:1;min-width:0">
        <div class="n-title">${n.title}</div>
        <div class="n-msg">${n.msg}</div>
        <div class="n-time">${fmtDate(n.createdAt)}</div>
      </div>
      <div class="n-right">
        <span class="pill ${n.type==='fraud'?'flag':n.cls==='ok'?'ok':n.cls==='err'?'fail':'warn'}" style="font-size:10px">${n.type.toUpperCase()}</span>
        ${!n.read ? '<div class="n-dot"></div>' : ''}
      </div>
    </div>`).join('');
}

function readNotif(id) {
  const n = all.find(x => String(x.id) === String(id));
  if (n && !n.read) { n.read = true; updateCounts(); render(); }
}

load();
ringTimer = createRefreshRing('ring-wrap', 30, load);
</script>
</body>
</html>
