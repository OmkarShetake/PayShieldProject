name: PayShield CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Build & test all Java services ─────────────────────────────────────────
  build-java:
    name: Build Java Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - payshield-auth
          - payshield-payment
          - payshield-fraud
          - payshield-reconciliation
          - payshield-notification
          - payshield-reporting

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 1

  # ── Build Python AI scorer ──────────────────────────────────────────────────
  build-python:
    name: Build AI Scorer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: payshield-ai-scorer
        run: pip install -r requirements.txt

      - name: Syntax check
        working-directory: payshield-ai-scorer
        run: python -m py_compile app/main.py && echo "Syntax OK"

  # ── Docker Compose smoke test ───────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [ build-java, build-python ]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "JWT_SECRET=ci-test-secret-key-at-least-32-chars-long" >> .env

      - name: Start infrastructure only
        run: docker compose -f infra-only.yml up -d

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker exec payshield-postgres pg_isready -U postgres && break
            sleep 2
          done

      - name: Verify Postgres is healthy
        run: docker exec payshield-postgres pg_isready -U postgres

      - name: Tear down
        if: always()
        run: docker compose -f infra-only.yml down -v
